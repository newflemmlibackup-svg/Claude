name: DVT-Sidexis-Importer bauen

on:
  push:
    branches: [main, "claude/**"]
    tags: ["dvt-v*"]
    paths:
      - "dvt_importer/**"
      - "tests/**"
      - "build/**"
      - "run.py"
      - "requirements.txt"
      - ".github/workflows/build-dvt-importer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DVT-Sidexis-Importer-Windows
          - os: macos-latest
            artifact: DVT-Sidexis-Importer-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest tests -q
      - name: Anwendung bauen
        run: python build/build.py
      - name: Selbsttest der fertigen Anwendung (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DVT-Sidexis-Importer.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Code $($p.ExitCode))" }
          $g = Start-Process -FilePath "dist\DVT-Sidexis-Importer.exe" -ArgumentList "--guitest" -Wait -PassThru
          if ($g.ExitCode -ne 0) { Get-Content "$HOME\DVT-Sidexis-Importer-Fehler.txt" -ErrorAction SilentlyContinue; throw "Oberflächentest fehlgeschlagen (Code $($g.ExitCode))" }
          Compress-Archive -Path "dist\DVT-Sidexis-Importer.exe" -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Selbsttest der fertigen Anwendung (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/DVT-Sidexis-Importer.app/Contents/MacOS/DVT-Sidexis-Importer --selftest
          dist/DVT-Sidexis-Importer.app/Contents/MacOS/DVT-Sidexis-Importer --guitest
          # Dasselbe mit der Fenstergröße eines kleinen MacBook-Bildschirms.
          DVT_TEST_SCREEN=1280x800 dist/DVT-Sidexis-Importer.app/Contents/MacOS/DVT-Sidexis-Importer --guitest
          # Start wie per Doppelklick im Finder: Die App muss nach 8 Sekunden noch laufen.
          open dist/DVT-Sidexis-Importer.app
          sleep 8
          pgrep -f "DVT-Sidexis-Importer.app/Contents/MacOS" || { cat ~/DVT-Sidexis-Importer-Fehler.txt 2>/dev/null; echo "App läuft nach Doppelklick-Start nicht"; exit 1; }
          screencapture -x start.png || true
          pkill -f "DVT-Sidexis-Importer.app/Contents/MacOS" || true
          codesign --verify --deep --strict dist/DVT-Sidexis-Importer.app
          ditto -c -k --keepParent dist/DVT-Sidexis-Importer.app "${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macOS-Startbild
          path: start.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/dvt-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
